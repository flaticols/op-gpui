[workspace]
members = [
    "crates/op-gpui",
    "crates/op-gpui-demo",
    "crates/op-sdk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Denis Panfilov"]

[workspace.dependencies]
base64 = "0.22"
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
libloading = "0.8"
op-gpui = { path = "crates/op-gpui" }
op-sdk = { path = "crates/op-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["alloc"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
